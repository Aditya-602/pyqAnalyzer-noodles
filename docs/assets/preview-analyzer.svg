<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, Menlo, Monaco, monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="1000" height="580" rx="14" fill="url(#anBg)"/>
  <rect width="1000" height="580" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Window Header / Controls -->
  <g transform="translate(24, 20)">
    <circle cx="8" cy="8" r="6" fill="#ef4444"/>
    <circle cx="28" cy="8" r="6" fill="#f59e0b"/>
    <circle cx="48" cy="8" r="6" fill="#10b981"/>
    <text x="476" y="12" fill="#9ca3af" font-size="12" class="font-sans" text-anchor="middle">pyq-analyzer • get-started</text>
  </g>

  <!-- Page Title -->
  <text x="500" y="85" fill="#ffffff" font-size="26" font-weight="700" class="font-sans" text-anchor="middle">Get Started</text>
  <text x="500" y="112" fill="#9ca3af" font-size="14" class="font-sans" text-anchor="middle">Choose your input method to analyze past examination questions</text>

  <!-- Two Columns Container -->
  <!-- Left Column: PDF Upload -->
  <g transform="translate(60, 140)" filter="url(#cardShadow)">
    <rect width="415" height="320" rx="16" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Upload Icon & Instruction -->
    <g transform="translate(207, 75)" text-anchor="middle">
      <circle cx="0" cy="0" r="30" fill="#3b82f6" fill-opacity="0.12"/>
      <path d="M-10 4 L0 -6 L10 4 M0 -6 L0 12 M-14 8 V16 H14 V8" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="52" fill="#ffffff" font-size="15" font-weight="600" class="font-sans">Upload Question Papers</text>
      <text x="0" y="74" fill="#9ca3af" font-size="12" class="font-sans">Drag &amp; drop PDFs or click to browse</text>
    </g>

    <!-- Uploaded File Pill Demo -->
    <g transform="translate(25, 215)">
      <rect width="365" height="44" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="27" fill="#ef4444" font-size="16">📄</text>
      <text x="42" y="27" fill="#f8fafc" font-size="13" font-weight="500" class="font-sans">Data_Structures_2024_PYQ.pdf</text>
      <text x="315" y="27" fill="#34d399" font-size="11" class="font-mono">Ready</text>
    </g>

    <g transform="translate(25, 265)">
      <rect width="365" height="40" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="25" fill="#ef4444" font-size="16">📄</text>
      <text x="42" y="25" fill="#f8fafc" font-size="13" font-weight="500" class="font-sans">Algorithms_Midterm_2023.pdf</text>
      <text x="315" y="25" fill="#34d399" font-size="11" class="font-mono">Ready</text>
    </g>
  </g>

  <!-- Right Column: Text Paste -->
  <g transform="translate(525, 140)" filter="url(#cardShadow)">
    <rect width="415" height="320" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    
    <text x="28" y="38" fill="#ffffff" font-size="15" font-weight="600" class="font-sans">Or Paste Questions Directly</text>
    <rect x="25" y="55" width="365" height="240" rx="10" fill="#030712" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <g fill="#94a3b8" font-size="12" class="font-mono" transform="translate(40, 85)">
      <text y="0">Q1. Explain AVL tree rotations with an example.</text>
      <text y="24">Q2. Derive the time complexity of QuickSort.</text>
      <text y="48">Q3. Compare Dijkstra vs Bellman-Ford algorithm.</text>
      <text y="72">Q4. What is dynamic programming? Solve 0/1 Knapsack.</text>
      <text y="96">Q5. Explain BFS vs DFS graph traversal.</text>
      <text y="120">Q6. Define B-Trees and their node split criteria.</text>
      <text y="150" fill="#64748b" font-style="italic">... (Paste exam sections or raw questions)</text>
    </g>
  </g>

  <!-- CTA Action Button -->
  <g transform="translate(380, 495)" filter="url(#cardShadow)">
    <rect width="240" height="48" rx="24" fill="url(#btnGrad)"/>
    <text x="120" y="30" fill="#ffffff" font-size="15" font-weight="600" class="font-sans" text-anchor="middle">
      Analyze Questions ⚡
    </text>
  </g>
</svg>
