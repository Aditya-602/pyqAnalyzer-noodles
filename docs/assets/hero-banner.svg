<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Monochrome Dark Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>

    <!-- Subtle White / Slate Radial Aurora Waves -->
    <radialGradient id="auroraWhite" cx="50%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#71717a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#27272a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients (Pure White to Zinc) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#auroraWhite)"/>
  <rect width="1200" height="480" fill="url(#auroraGlow)"/>

  <!-- Minimalist Grid Dots -->
  <g opacity="0.07" fill="#ffffff">
    <circle cx="120" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="360" cy="80" r="1.5"/>
    <circle cx="840" cy="80" r="1.5"/><circle cx="960" cy="80" r="1.5"/><circle cx="1080" cy="80" r="1.5"/>
    <circle cx="120" cy="200" r="1.5"/><circle cx="1080" cy="200" r="1.5"/>
    <circle cx="120" cy="340" r="1.5"/><circle cx="1080" cy="340" r="1.5"/>
    <circle cx="120" cy="420" r="1.5"/><circle cx="240" cy="420" r="1.5"/><circle cx="360" cy="420" r="1.5"/>
    <circle cx="840" cy="420" r="1.5"/><circle cx="960" cy="420" r="1.5"/><circle cx="1080" cy="420" r="1.5"/>
  </g>

  <!-- Top Dynamic Island Pill (Black & White Dark Mode) -->
  <g filter="url(#pillShadow)" transform="translate(440, 36)">
    <rect width="320" height="44" rx="22" fill="#09090b" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="26" cy="22" r="3.5" fill="#ffffff" opacity="0.8"/>
    <text x="56" y="27" fill="#a1a1aa" class="font-sans" font-size="13" font-weight="500">Home</text>
    <rect x="115" y="8" width="90" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="160" y="26" fill="#ffffff" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">Start</text>
    <text x="254" y="27" fill="#a1a1aa" class="font-sans" font-size="13" font-weight="500">About</text>
  </g>

  <!-- Center Branding: N👀DLES -->
  <g text-anchor="middle" class="font-sans">
    <!-- Ambient White Glow Under Typography -->
    <text x="600" y="222" font-size="88" font-weight="900" letter-spacing="12" fill="#ffffff" opacity="0.12" filter="url(#softGlow)">N👀DLES</text>
    <text x="600" y="220" font-size="88" font-weight="900" letter-spacing="12" fill="url(#titleGrad)">N👀DLES</text>

    <!-- Monochrome Glowing Divider -->
    <rect x="470" y="244" width="260" height="1.5" fill="url(#dividerGrad)"/>

    <!-- Subtitle & Value Proposition -->
    <text x="600" y="286" font-size="21" font-weight="500" fill="#f4f4f5" letter-spacing="0.5">
      AI-Powered Previous Year Questions (PYQ) Analyzer
    </text>
    <text x="600" y="318" font-size="14" font-weight="300" fill="#a1a1aa" letter-spacing="0.3">
      Multi-PDF OCR Extraction • Syllabus Topic Modeling • High-Yield Revision Notes
    </text>
  </g>

  <!-- Monochrome Feature Badge Chips -->
  <g transform="translate(195, 375)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="185" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="24" cy="20" r="4" fill="#ffffff"/>
      <text x="42" y="25" fill="#f4f4f5" class="font-sans" font-size="13" font-weight="500">Gemini 2.5 Flash</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(200, 0)">
      <rect width="195" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="24" cy="20" r="4" fill="#ffffff"/>
      <text x="42" y="25" fill="#f4f4f5" class="font-sans" font-size="13" font-weight="500">EasyOCR &amp; PyMuPDF</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(410, 0)">
      <rect width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="24" cy="20" r="4" fill="#ffffff"/>
      <text x="42" y="25" fill="#f4f4f5" class="font-sans" font-size="13" font-weight="500">Frequency &amp; Ranking</text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(625, 0)">
      <rect width="185" height="40" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="24" cy="20" r="4" fill="#ffffff"/>
      <text x="42" y="25" fill="#f4f4f5" class="font-sans" font-size="13" font-weight="500">Dynamic Island UI</text>
    </g>
  </g>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
</svg>
